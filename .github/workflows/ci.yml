# Offline test + lint gate. The suite is fully mocked (Ollama/ntfy/proxy), and the
# real-DINOv3 tests self-skip when torch or the gated weights are absent
# (tests/test_deduplication.py module-level skip), so this runs on clean runners
# with only the light deps — do NOT install torch/transformers here.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps (light — no torch/transformers)
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy xgboost Pillow requests

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q
