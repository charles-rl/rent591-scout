# GitHub Actions cron relay for the 591 scraper.
#
# The GPU server's egress firewall blocks rent.591.com.tw / ntfy.sh but whitelists
# github.com. This workflow runs on GitHub's cloud runners (which can reach 591),
# scrapes raw listing payloads + WebP images into data/incoming/, and commits them
# back to this repo. The GPU server `git pull`s the payloads and runs the heavy
# local AI inference (DINOv3 dedup, Qwen vision, XGBoost) fully offline via
# `python main.py --incoming`.
name: scrape-relay

on:
  schedule:
    # Tier 1 — hot zones every 15 min (docs/591research.md §5)
    - cron: '*/15 * * * *'
    # Tier 2 — secondary zones hourly (offset +5min so it never collides with a :00/:15 tier-1 run)
    - cron: '5 * * * *'
    # Tier 3 — tertiary zones every 3 hours (offset +10min)
    - cron: '10 */3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Polling tier to run manually (1/2/3)'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3']
      limit:
        description: 'Max listings per run (-1 = all fetched)'
        required: false
        default: '-1'
        type: string

permissions:
  contents: write

concurrency:
  group: scrape-relay
  cancel-in-progress: false

jobs:
  scrape:
    # GitHub-hosted runners are intermittently 403'd by 591's WAF/CDN (datacenter
    # IP blocklisting, incl. img1/img2.591.com.tw). If image pulls keep failing,
    # switch to a self-hosted runner on a 591-reachable network:
    #   runs-on: [self-hosted, 591-relay]
    # Nothing else changes — the workflow never depends on GitHub-specific infra.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve polling tier (docs/591research.md §5)
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TIER: ${{ inputs.tier }}
        run: |
          case "$SCHEDULE" in
            '5 * * * *')  TIER=2 ;;
            '10 */3 * * *') TIER=3 ;;
            '*/15 * * * *') TIER=1 ;;
            *) TIER="${INPUT_TIER:-1}" ;;
          esac
          case "$TIER" in
            1) QUERIES="新北市:汐止區,三重區;台北市:南港區" ;;
            2) QUERIES="台北市:內湖區,北投區,大同區,士林區;新北市:蘆洲區" ;;
            3) QUERIES="新北市:淡水區,板橋區" ;;
            *) echo "invalid tier: $TIER" >&2; exit 1 ;;
          esac
          echo "POLL_TIER=$TIER" >> "$GITHUB_ENV"
          echo "X591_QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "tier $TIER -> $QUERIES"

      - name: Probe 591 endpoints (prove runner is not blocked)
        run: |
          echo "runner egress IP: $(curl -s --max-time 15 https://ifconfig.me/ip || echo unknown)"
          rc=0
          for url in https://rent.591.com.tw/ https://bff-house.591.com.tw/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "$url -> HTTP $code"
            case "$code" in 000) rc=1;; esac
          done
          sleep 30
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://rent.591.com.tw/ || echo 000)
          echo "rent.591.com.tw (retry +30s) -> HTTP $code"
          exit $rc

      - name: Self-test 591 API (warm-up + one search page)
        run: python -m src.ingestion --selftest

      - name: Run scraper (dump raw payloads + WebP)
        env:
          # Set repo variable RELAY_SKIP_IMAGES=true for text-only relay while the
          # image CDN is blocking runner IPs (saves ~350 doomed CDN hits per run).
          RELAY_SKIP_IMAGES: ${{ vars.RELAY_SKIP_IMAGES }}
        run: |
          mkdir -p data/incoming
          python -m src.ingestion --output-dir data/incoming/ \
            --limit "${{ inputs.limit || '-1' }}"

      - name: Commit and push changes
        run: |
          git config user.name "591-scraper-bot"
          git config user.email "bot@noreply.github.com"
          git add -A data/incoming/
          if git diff --cached --quiet; then
            echo "No incoming changes to commit."
            exit 0
          fi
          git commit -m "auto(ingest): sync 591 listings [skip ci]"
          # Rebase on any commit pushed by a concurrent run before pushing back.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
